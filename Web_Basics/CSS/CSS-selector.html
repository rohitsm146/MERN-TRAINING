<!DOCTYPE html>
<html>
<head>
    <!-- Internal CSS -->
    <style>
        /* Element Selector */
        h1 {
            color: blue;
        }
        /* ID Selector */
        #p1 {
            color: red;
        }
        /* Class Selector */
        .para2 {
            color: green;
        }
    </style>
</head>
<body>
    <h1>Heading</h1>
    <h2>Sub Heading</h2>
    <p id="p1">This is a paragraph.</p>
    <p class="para2">Hello MERN</p>
    <p>Welcome to CSS</p>
    <p>How are you?</p>
</body>
</html>
