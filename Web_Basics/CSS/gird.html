<!DOCTYPE html>
<html>
    <head>
        <title>Grid</title>
        <style>
            .grid-container{
                display:grid;
                grid-template-columns: auto auto auto;
            }

        </style>
    </head>
    <body>
        <div class="grid-container">
            <div >1</div>
            <div >2</div>
            <div >3</div>
            <div >4</div>
            <div >5</div>
            <div >6</div>
        </div>
    </body>
</html>
