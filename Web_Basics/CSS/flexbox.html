<!DOCTYPE html>
<html>
    <head>
        <title>FlexBox</title>
        <style>
            .Container{
                display:flex;
                flex-direction: column;
                background-color: aliceblue;
            }
            .Container > div{
                background-color: lightcoral;
                margin: 5px;
                padding: 20px;
                font-size: 20px;
            }
        </style>
    </head>
    <body>
        <div class="Container">
            <div>Item1</div>
            <div>Item2</div>
            <div>Item3</div>
            <div>Item4</div>
            <div>Item5</div>
        </div>
    </body>
</html>
